[package]
name = "wscript-cli"
description = "wscript command-line interface: run, check, repl, lsp"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "wscript_cli"
path = "src/lib.rs"

[[bin]]
name = "wscript"
path = "src/main.rs"

[dependencies]
wscript.workspace = true
wscript-std.workspace = true
wscript-compiler.workspace = true
ariadne = "0.6"
rustyline = "18"
toml = "1"
tower-lsp-server = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros"] }

[dev-dependencies]
# The fuel snapshot reads bytecode to prove the corpus covers every path
# fuel is charged at; the .wscripti tests compare `Const`s and run a unit
# compiled against an interface registry the umbrella never built.
wscript-core.workspace = true
wscript-vm.workspace = true
