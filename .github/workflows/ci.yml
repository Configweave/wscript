name: CI

# Every *check* job invokes a recipe from the `ci` just module rather than
# inlining the command, so the workflow and `just ci::check` cannot drift in what
# a check actually does. Jobs stay separate to preserve parallelism.
#
# The release jobs below inline their steps instead, because they have no local
# counterpart to drift from and because the fleet reads them as one pattern —
# `config-weave`, `vmlab` and `wcl` carry the same three jobs, and `/afk-release`
# checks a repo is release-capable by grepping this file for the trailer.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@just
      - run: just ci::workspace-fmt-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - run: just ci::workspace-lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - run: just ci::workspace-test

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - run: just ci::examples-run

  # ── Version ───────────────────────────────────────────────────────────────
  # Trailer-gated, and the entry point to everything below: a push to main whose
  # HEAD commit carries no publish trailer runs the checks above and stops here.
  #
  #   pre-release: true   ->  vX.Y.Z-alpha, marked pre-release on GitHub
  #   release: true       ->  vX.Y.Z, a stable release
  #
  # Both are enabled deliberately. `wcl` blocks the stable trailer because it is
  # pre-release only; here the stable path is the human promotion step at the end
  # of `/afk-release` — an agent may cut the alpha, a person cuts the release —
  # so blocking it would leave that flow with nothing to promote to.
  version:
    name: Calculate version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.calc.outputs.version }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
      do_release: ${{ steps.calc.outputs.do_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the bump is computed from the commits since the last tag.
          fetch-depth: 0
      - id: calc
        run: |
          IS_RELEASE=$(git log -1 --format='%(trailers:key=release,valueonly)')
          IS_PRERELEASE=$(git log -1 --format='%(trailers:key=pre-release,valueonly)')

          if [[ "$IS_RELEASE" != "true" && "$IS_PRERELEASE" != "true" ]]; then
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "No release/pre-release trailer on HEAD — tests only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Next version = bump from the last v* tag, scanning conventional
          # commits since that tag for the bump level (0.x: major -> minor).
          # Highest version among the tags reachable from HEAD, NOT the nearest
          # one: `git describe --abbrev=0` returns the closest tag by commit
          # distance, which in `config-weave` made v0.2.0-alpha be followed by
          # v0.1.2-alpha once a tag landed on a more recent commit than the one
          # carrying the higher version. Version order is the only order that
          # matters here.
          LAST_TAG=$(git tag --list 'v*' --merged HEAD --sort=-v:refname | head -1)
          if [[ -z "$LAST_TAG" ]]; then
            # Nothing tagged yet. Bump from the version the workspace manifest
            # already declares, not from 0.0.0: this repo reached 0.2.0 in
            # Cargo.toml without ever publishing, and the release build stamps
            # that manifest, so starting at zero would publish a tag below what
            # the tree already claims *and* rewrite the workspace down to it.
            SEED=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
            SEED="${SEED%%-*}"
            IFS='.' read -r PREV_MAJOR PREV_MINOR PREV_PATCH <<< "${SEED:-0.0.0}"
            RANGE="HEAD"
          else
            VER="${LAST_TAG#v}"; VER="${VER%%-*}"
            IFS='.' read -r PREV_MAJOR PREV_MINOR PREV_PATCH <<< "$VER"
            RANGE="${LAST_TAG}..HEAD"
          fi

          BUMP="none"
          while IFS= read -r HASH; do
            SUBJECT=$(git log -1 --format='%s' "$HASH")
            BODY=$(git log -1 --format='%b' "$HASH")
            if echo "$SUBJECT" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$BODY" | grep -qiE '^BREAKING[ -]CHANGE:'; then
              BUMP="major"
            elif echo "$SUBJECT" | grep -qE '^feat(\(.+\))?:' && [[ "$BUMP" != "major" ]]; then
              BUMP="minor"
            elif echo "$SUBJECT" | grep -qE '^(fix|perf|refactor|build|ci|docs|style|test|chore|revert)(\(.+\))?:' && [[ "$BUMP" == "none" ]]; then
              BUMP="patch"
            fi
          done < <(git log --format='%H' $RANGE)
          [[ "$BUMP" == "none" ]] && BUMP="patch"

          case "$BUMP" in
            major)
              if [[ "$PREV_MAJOR" -eq 0 ]]; then MAJOR=0; MINOR=$((PREV_MINOR + 1)); PATCH=0
              else MAJOR=$((PREV_MAJOR + 1)); MINOR=0; PATCH=0; fi ;;
            minor) MAJOR=$PREV_MAJOR; MINOR=$((PREV_MINOR + 1)); PATCH=0 ;;
            patch) MAJOR=$PREV_MAJOR; MINOR=$PREV_MINOR; PATCH=$((PREV_PATCH + 1)) ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          PRERELEASE=false
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            VERSION="${VERSION}-alpha"
            PRERELEASE=true
          fi

          echo "Calculated version: $VERSION (bump=$BUMP, prerelease=$PRERELEASE, from ${LAST_TAG:-none})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "do_release=true" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Release

          | | |
          |---|---|
          | **Version** | \`$VERSION\` |
          | **Bump** | $BUMP |
          | **Pre-release** | $PRERELEASE |
          | **Previous tag** | \`${LAST_TAG:-none}\` |
          SUMMARY

  # ── CLI binaries ──────────────────────────────────────────────────────────
  # Build the `wscript` CLI (run/check/repl/lsp) for Linux + Windows on x86_64
  # so the release can ship downloadable binaries. Native runners rather than
  # `cross`: nothing in the workspace needs a C toolchain. Version-stamped
  # first, so `wscript --version` — which reads CARGO_PKG_VERSION — matches the
  # tag it was published under.
  #
  # Gated on every check job, not just `test`: a release is the one build whose
  # provenance has to be beyond argument.
  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: [version, fmt, lint, test, examples]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: wscript
            suffix: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: wscript.exe
            suffix: windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Stamp version
        run: just release-stamp "${{ needs.version.outputs.version }}"
      - name: Build
        run: cargo build -p wscript-cli --bin wscript --release --target ${{ matrix.target }}
      - name: Stage asset
        run: |
          V="${{ needs.version.outputs.version }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "wscript-$V-${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: wscript-*-${{ matrix.suffix }}
          retention-days: 1

  # ── Release ───────────────────────────────────────────────────────────────
  # Tag the commit and cut a GitHub (pre-)release with the binaries attached.
  release:
    name: Create GitHub release
    needs: [version, build-cli]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Tag
        run: |
          V="${{ needs.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$V"
          git push origin "v$V"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/**/*
